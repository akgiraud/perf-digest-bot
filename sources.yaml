# إعدادات البوت — عدّل المصادر والكلمات المفتاحية براحتك

model: claude-sonnet-5-5
hours_back: 26            # كم ساعة يرجع للخلف (26 بدل 24 عشان ما يفوته شي لو تأخر التشغيل)
max_items_total: 120      # أقصى عدد مقالات يرسلها لـ Claude
max_topics: 6             # أقصى عدد مواضيع في الملخص
timezone_offset_hours: 3  # توقيت الرياض لعنوان الرسالة

# مجالات الشغل اللي لازم تكون الفكرة مناسبة لها
business_lines:
  - اتصالات (باقات مفوترة، فايبر، 5G، انترنت منزلي)
  - مسبق الدفع (شحن، باقات، استقطاب مشتركين جدد)
  - متجر بيع الأجهزة (جوالات، أجهزة، ملحقات - تجارة إلكترونية)
  - باقات السفر والتجوال (eSIM، رومنق)
  - التطبيقات الرقمية (تحميل التطبيق، التفعيل، الاستخدام)

# فلتر أولي بالكلمات (يطبق على المصادر اللي عليها filter: true)
# بعده Claude يسوي الفلترة الصارمة النهائية
